<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6b21a8" />
    <title>Offline - Purple Yam AIMS</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf7ff; color: #241333; }
      main { width: min(90%, 28rem); padding: 2rem; border: 1px solid #e7dcef; border-radius: 1rem; background: white; box-sizing: border-box; text-align: center; }
      h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
      p { line-height: 1.6; color: #5f5369; }
      button { margin-top: .75rem; padding: .75rem 1rem; border: 0; border-radius: .6rem; background: #6b21a8; color: white; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid #c4a2e3; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re currently offline</h1>
      <p>Purple Yam AIMS can’t reach the server right now. No transaction has been saved by this page. Please reconnect before recording or changing inventory.</p>
      <p>When the connection returns, try opening the app again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
